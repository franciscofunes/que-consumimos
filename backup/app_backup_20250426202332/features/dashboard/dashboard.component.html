<div class="min-h-screen bg-gray-100">
  <header class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-900">¿Qué Consumimos?</h1>
      
      <div class="flex items-center space-x-2">
        <span class="text-sm text-gray-700">{{ authService.currentUser()?.displayName || 'Usuario' }}</span>
        <img *ngIf="authService.currentUser()?.photoURL" [src]="authService.currentUser()?.photoURL" class="h-8 w-8 rounded-full" alt="User avatar">
        <button 
          (click)="signOut()"
          class="ml-2 px-3 py-1 text-sm bg-gray-200 hover:bg-gray-300 rounded">
          Salir
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Dashboard</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="p-4 border rounded-lg hover:shadow-md transition">
          <h3 class="font-medium">Productos</h3>
          <p class="text-gray-500 text-sm">Ver y administrar productos</p>
          <a routerLink="/products" class="text-blue-500 text-sm mt-2 inline-block">Ver productos →</a>
        </div>
        
        <div class="p-4 border rounded-lg hover:shadow-md transition">
          <h3 class="font-medium">Escanear</h3>
          <p class="text-gray-500 text-sm">Escanear productos con la cámara</p>
          <a routerLink="/scan" class="text-blue-500 text-sm mt-2 inline-block">Ir a escanear →</a>
        </div>
      </div>
    </div>
  </main>
</div>
