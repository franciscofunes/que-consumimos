<!-- Mobile navigation bar component -->
<div
  class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-10 md:hidden lg:hidden"
>
  <div class="grid grid-cols-5 h-16">
    <!-- Home button -->
    <a
    (click)="navigateTo('/dashboard')"
      class="flex flex-col items-center justify-center text-gray-500 hover:text-indigo-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
        />
      </svg>
      <span class="text-xs mt-1">Inicio</span>
    </a>

    <!-- Products button -->
    <a
      (click)="navigateTo('/products')"
      class="flex flex-col items-center justify-center text-gray-500 hover:text-indigo-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
        />
      </svg>
      <span class="text-xs mt-1">Productos</span>
    </a>

    <!-- Add Product button (centered with proper positioning) -->
    <div class="relative flex justify-center">
      <a
        (click)="navigateTo('/product-scan')"
        class="absolute -top-5 flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600 text-white shadow-lg"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6v6m0 0v6m0-6h6m-6 0H6"
          />
        </svg>
      </a>
    </div>

    <!-- Scan button -->
    <a
      href="/product-scan"
      class="flex flex-col items-center justify-center text-gray-500 hover:text-indigo-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 mb-1"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
        />
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
        />
      </svg>
      <span class="text-xs mt-1">Ajustes</span>
    </a>

    <!-- Profile button -->
    <a
      href="/profile"
      class="flex flex-col items-center justify-center text-gray-500 hover:text-indigo-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
      <span class="text-xs mt-1">Perfil</span>
    </a>
  </div>
</div>
