<header class="bg-white shadow">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
    <h1 
      (click)="navigateTo('/dashboard')" 
      class="text-xl font-bold cursor-pointer relative group">
      <!-- Animated logo with glow effect -->
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-purple-500 via-pink-500 to-indigo-500 inline-block transform transition-transform duration-300 group-hover:scale-105">
        ¿Qué Consumimos?
      </span>
      <!-- Animated underline for logo -->
      <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-purple-500 via-pink-500 to-indigo-500 group-hover:w-full transition-all duration-300"></span>
    </h1>
    
    <!-- Desktop navigation -->
    <div class="hidden md:flex items-center space-x-6">
      <button 
        (click)="navigateTo('/products')" 
        class="text-gray-600 hover:text-indigo-600 transition-colors duration-300 relative group">
        Productos
        <!-- Animated underline -->
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-indigo-600 group-hover:w-full transition-all duration-300"></span>
      </button>
      <button 
        (click)="navigateTo('/product-scan')" 
        class="text-gray-600 hover:text-indigo-600 transition-colors duration-300 relative group">
        Escanear
        <!-- Animated underline -->
        <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-indigo-600 group-hover:w-full transition-all duration-300"></span>
      </button>
      
      <div class="flex items-center space-x-2 pl-4 border-l border-gray-200">
        <span class="text-sm text-gray-700">{{ getName() }}</span>
        <ng-container *ngIf="getPhoto()">
          <div class="h-8 w-8 rounded-full overflow-hidden ring-2 ring-indigo-500 ring-offset-2 transition-all duration-300 hover:ring-offset-4">
            <img [src]="getPhoto()" class="h-full w-full object-cover" alt="User avatar">
          </div>
        </ng-container>
        <ng-container *ngIf="!getPhoto()">
          <div class="h-8 w-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center text-white ring-2 ring-indigo-500 ring-offset-2 transition-all duration-300 hover:ring-offset-4">
            {{ getInitials() }}
          </div>
        </ng-container>
        <button 
          (click)="signOut()"
          class="ml-2 px-3 py-1.5 text-sm text-white bg-gradient-to-r from-indigo-500 to-purple-500 rounded hover:from-indigo-600 hover:to-purple-600 transition-all duration-300 transform hover:-translate-y-0.5 hover:shadow-md">
          Salir
        </button>
      </div>
    </div>
  </div>
</header>
