<div class="flex flex-col items-center justify-center p-4">
  <!-- Multi-ring animated spinner -->
  <div class="relative" [ngClass]="{
    'h-6 w-6': size === 'sm',
    'h-12 w-12': size === 'md',
    'h-20 w-20': size === 'lg'
  }">
    <!-- Outer ring -->
    <div class="absolute inset-0 rounded-full border-2 border-t-transparent border-blue-500 animate-spin"></div>
    
    <!-- Middle ring with different speed -->
    <div class="absolute inset-0 rounded-full border-2 border-t-transparent border-purple-500 animate-[spin_1.5s_linear_infinite] scale-75"></div>
    
    <!-- Inner ring with different speed and opacity -->
    <div class="absolute inset-0 rounded-full border-2 border-t-transparent border-pink-500 animate-[spin_2s_linear_infinite] scale-50"></div>
    
    <!-- Center dot -->
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-white" [ngClass]="{
      'h-1 w-1': size === 'sm',
      'h-2 w-2': size === 'md',
      'h-3 w-3': size === 'lg'
    }"></div>
  </div>
  
  <!-- Loading message with fade-in animation -->
  <p 
    *ngIf="message" 
    class="mt-4 text-gray-700 animate-pulse"
    [ngClass]="{
      'text-xs': size === 'sm',
      'text-sm': size === 'md',
      'text-base': size === 'lg'
    }">
    {{ message }}
    <!-- Animated dots -->
    <span class="inline-block animate-[bounce_1s_infinite]">.</span>
    <span class="inline-block animate-[bounce_1s_infinite_0.2s]">.</span>
    <span class="inline-block animate-[bounce_1s_infinite_0.4s]">.</span>
  </p>
</div>
