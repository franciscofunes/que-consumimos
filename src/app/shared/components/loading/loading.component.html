<div class="flex flex-col items-center justify-center p-4">
  <div 
    class="animate-spin rounded-full border-b-2 border-blue-500" 
    [ngClass]="{
      'h-4 w-4': size === 'sm',
      'h-8 w-8': size === 'md',
      'h-12 w-12': size === 'lg'
    }">
  </div>
  <p 
    *ngIf="message" 
    class="mt-2 text-gray-600"
    [ngClass]="{
      'text-xs': size === 'sm',
      'text-sm': size === 'md',
      'text-base': size === 'lg'
    }">
    {{ message }}
  </p>
</div>
