<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 px-4 sm:px-6">
  <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-2xl backdrop-blur-sm bg-opacity-90 sm:rounded-2xl md:rounded-2xl">
    <div class="px-4 py-8 sm:px-8 sm:py-10">
      <div class="flex justify-center mb-8">
        <div class="w-16 h-16 flex items-center justify-center rounded-full bg-blue-600 text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
      </div>
      
      <h1 class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-2">¿Qué Consumimos?</h1>
      
      <div class="relative mb-10">
        <p class="text-center text-gray-600">Inicia sesión para continuar</p>
        <div class="absolute w-20 h-1 bg-blue-600 bottom-0 left-1/2 transform -translate-x-1/2 -mb-2 rounded-full"></div>
      </div>
      
      <button 
        (click)="signInWithGoogle()" 
        [disabled]="(loading$ | async) === true"
        class="w-full flex items-center justify-center gap-3 p-4 rounded-lg transition-all duration-300 ease-in-out
               bg-white border border-gray-300 hover:shadow-lg hover:border-blue-400 active:scale-98 
               disabled:opacity-70 disabled:cursor-not-allowed">
        
        @if ((loading$ | async) === true) {
          <div class="flex items-center justify-center">
            <div class="w-5 h-5 border-2 border-t-transparent border-blue-600 rounded-full animate-spin mr-2"></div>
            <span class="text-gray-700">Cargando...</span>
          </div>
        } @else {
          <!-- Built-in Google icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
          </svg>
          <span class="font-medium text-gray-700">Continuar con Google</span>
        }
      </button>
      
      @if (error$ | async; as error) {
        <div class="mt-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-md">
          <div class="flex items-start">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-500 mr-2 mt-0.5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
            <p class="text-sm text-red-700">{{ error }}</p>
          </div>
        </div>
      }
      
      <div class="mt-10 text-center text-xs text-gray-500">
        <p>Al iniciar sesión, aceptas nuestros términos y condiciones</p>
      </div>
    </div>
  </div>
  
  <div class="hidden md:block absolute bottom-10 right-10">
    <div class="w-20 h-20 rounded-full bg-white opacity-10"></div>
  </div>
  <div class="hidden md:block absolute top-10 left-10">
    <div class="w-32 h-32 rounded-full bg-white opacity-10"></div>
  </div>
</div>
